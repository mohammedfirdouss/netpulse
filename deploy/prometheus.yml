# 5s scrape and evaluation (the Prometheus default is 1m) so fault-injection
# detection times are dominated by the alert windows, not by polling.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: netpulse
    static_configs:
      - targets: ["netpulse:9101"]
